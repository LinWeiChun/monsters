spring:
  application:
    name: monsters
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  jpa:
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
  flyway:
    baseline-on-migrate: true
    baseline-version: 1
    validate-on-migrate: true
  servlet:
    multipart:
      max-file-size: ${MULTIPART_MAX_FILE_SIZE:50MB}
      max-request-size: ${MULTIPART_MAX_REQUEST_SIZE:60MB}
  mail:
    host: ${SMTP_HOST:smtp.resend.com}
    port: ${SMTP_PORT:587}
    username: ${SMTP_USERNAME:resend}
    password: ${RESEND_API_KEY:${SMTP_PASSWORD:}}
    properties:
      mail:
        smtp:
          auth: ${SMTP_AUTH:true}
          starttls:
            enable: ${SMTP_STARTTLS_ENABLED:true}

server:
  port: 8080
  forward-headers-strategy: framework

app:
  registration:
    documents:
      terms:
        version: ${REGISTRATION_TERMS_VERSION:}
        url: ${REGISTRATION_TERMS_URL:}
      privacy:
        version: ${REGISTRATION_PRIVACY_VERSION:}
        url: ${REGISTRATION_PRIVACY_URL:}
    email-verification:
      public-url: ${EMAIL_VERIFICATION_PUBLIC_URL:}
      token-ttl-hours: ${EMAIL_VERIFICATION_TOKEN_TTL_HOURS:24}
      max-delivery-attempts: ${EMAIL_VERIFICATION_MAX_DELIVERY_ATTEMPTS:5}
      worker-enabled: ${EMAIL_VERIFICATION_WORKER_ENABLED:false}
      worker-delay-ms: ${EMAIL_VERIFICATION_WORKER_DELAY_MS:5000}
      unverified-retention-days: ${UNVERIFIED_MEMBER_RETENTION_DAYS:7}
      cleanup-batch-size: ${UNVERIFIED_MEMBER_CLEANUP_BATCH_SIZE:100}
      cleanup-enabled: ${UNVERIFIED_MEMBER_CLEANUP_ENABLED:false}
      cleanup-cron: "${UNVERIFIED_MEMBER_CLEANUP_CRON:0 45 3 * * *}"
    eligibility:
      service-region: ${ELIGIBILITY_SERVICE_REGION:TW}
      minor-notice-version: ${MINOR_NOTICE_VERSION:}
      minor-notice-url: ${MINOR_NOTICE_URL:}
      guardian-consent-version: ${GUARDIAN_CONSENT_VERSION:}
      guardian-consent-url: ${GUARDIAN_CONSENT_URL:}
      public-nickname-disclosure-version: ${PUBLIC_NICKNAME_DISCLOSURE_VERSION:}
      public-nickname-disclosure-url: ${PUBLIC_NICKNAME_DISCLOSURE_URL:}
      guardian-action-public-url: ${GUARDIAN_ACTION_PUBLIC_URL:}
      grant-token-ttl-hours: ${GUARDIAN_GRANT_TOKEN_TTL_HOURS:24}
      withdrawal-token-ttl-minutes: ${GUARDIAN_WITHDRAW_TOKEN_TTL_MINUTES:15}
    rate-limit:
      hash-key: ${REGISTRATION_RATE_LIMIT_HASH_KEY:}
      email-cooldown-seconds: ${REGISTRATION_EMAIL_COOLDOWN_SECONDS:60}
      email-max-attempts: ${REGISTRATION_EMAIL_MAX_ATTEMPTS:5}
      ip-max-attempts: ${REGISTRATION_IP_MAX_ATTEMPTS:20}
      window-minutes: ${REGISTRATION_RATE_LIMIT_WINDOW_MINUTES:15}
    email:
      smtp:
        enabled: ${REGISTRATION_SMTP_ENABLED:false}
        from: ${REGISTRATION_SMTP_FROM:}
        subject: ${REGISTRATION_SMTP_SUBJECT:Verify your Monsters email}
        guardian-grant-subject: ${GUARDIAN_GRANT_SMTP_SUBJECT:貘nsters 監護人同意確認}
        guardian-withdraw-subject: ${GUARDIAN_WITHDRAW_SMTP_SUBJECT:貘nsters 監護人同意撤回確認}
  entry-draft:
    retention-days: ${ENTRY_DRAFT_RETENTION_DAYS:30}
    cleanup-cron: "${ENTRY_DRAFT_CLEANUP_CRON:0 30 3 * * *}"
  cors:
    allowed-origin-patterns: ${CORS_ALLOWED_ORIGIN_PATTERNS:http://localhost:*,http://127.0.0.1:*}
    allowed-methods: ${CORS_ALLOWED_METHODS:GET,POST,PUT,PATCH,DELETE,OPTIONS}
    allowed-headers: ${CORS_ALLOWED_HEADERS:Authorization,Content-Type,Range,X-Session-Transport,X-CSRF-Protection,X-Client-Platform,X-Reauthentication-Credential}
    exposed-headers: ${CORS_EXPOSED_HEADERS:Authorization,Accept-Ranges,Content-Length,Content-Range}
    allow-credentials: ${CORS_ALLOW_CREDENTIALS:true}
    max-age: ${CORS_MAX_AGE:3600}
  security:
    jwt:
      issuer: ${JWT_ISSUER:monsters}
      secret: ${JWT_SECRET:}
      access-token-expiration-seconds: ${JWT_ACCESS_TOKEN_EXPIRATION_SECONDS:600}
      refresh-token-expiration-seconds: ${JWT_REFRESH_TOKEN_EXPIRATION_SECONDS:2592000}
    session:
      idle-expiration-seconds: ${SESSION_IDLE_EXPIRATION_SECONDS:2592000}
      absolute-expiration-seconds: ${SESSION_ABSOLUTE_EXPIRATION_SECONDS:7776000}
      refresh-concurrency-grace-seconds: ${SESSION_REFRESH_CONCURRENCY_GRACE_SECONDS:10}
      refresh-derivation-key: ${SESSION_REFRESH_DERIVATION_KEY:}
    web-session:
      trusted-origin-patterns: ${WEB_SESSION_TRUSTED_ORIGIN_PATTERNS:http://localhost:*,http://127.0.0.1:*}
      cookie-max-age-seconds: ${WEB_SESSION_COOKIE_MAX_AGE_SECONDS:7776000}
    google:
      client-ids: ${GOOGLE_CLIENT_IDS:}
  storage:
    r2:
      account-id: ${R2_ACCOUNT_ID:}
      access-key-id: ${R2_ACCESS_KEY_ID:}
      secret-access-key: ${R2_SECRET_ACCESS_KEY:}
      bucket: ${R2_BUCKET:}
      public-base-url: ${R2_PUBLIC_BASE_URL:}
      avatar-key-prefix: ${R2_AVATAR_KEY_PREFIX:users/avatars}
      max-avatar-size-bytes: ${R2_MAX_AVATAR_SIZE_BYTES:5242880}
      entry-media-bucket: ${R2_ENTRY_MEDIA_BUCKET:}
      entry-media-key-prefix: ${R2_ENTRY_MEDIA_KEY_PREFIX:entries/media}
      max-entry-image-size-bytes: ${R2_MAX_ENTRY_IMAGE_SIZE_BYTES:5242880}
      max-entry-audio-size-bytes: ${R2_MAX_ENTRY_AUDIO_SIZE_BYTES:10485760}
      max-entry-video-size-bytes: ${R2_MAX_ENTRY_VIDEO_SIZE_BYTES:52428800}
      max-entry-drawing-size-bytes: ${R2_MAX_ENTRY_DRAWING_SIZE_BYTES:5242880}
      max-entry-audio-duration-seconds: ${R2_MAX_ENTRY_AUDIO_DURATION_SECONDS:300}
      max-entry-video-duration-seconds: ${R2_MAX_ENTRY_VIDEO_DURATION_SECONDS:60}
      ffprobe-path: ${FFPROBE_PATH:ffprobe}
      ffprobe-timeout-seconds: ${FFPROBE_TIMEOUT_SECONDS:10}
