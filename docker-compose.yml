services:
  mysql:
    image: mysql:8.4
    container_name: monsters-mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-monsters}
      MYSQL_USER: ${MYSQL_USER:-monsters}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-monsters}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root}
      TZ: Asia/Taipei
    ports:
      - "${MYSQL_PORT:-3306}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./database/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u$${MYSQL_USER} -p$${MYSQL_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  backend:
    build:
      context: ./backend
    container_name: monsters-backend
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: dev
      DB_URL: jdbc:mysql://mysql:3306/${MYSQL_DATABASE:-monsters}?useSSL=false&serverTimezone=Asia/Taipei&allowPublicKeyRetrieval=true
      DB_USERNAME: ${MYSQL_USER:-monsters}
      DB_PASSWORD: ${MYSQL_PASSWORD:-monsters}
      R2_ACCOUNT_ID: ${R2_ACCOUNT_ID:-}
      R2_ACCESS_KEY_ID: ${R2_ACCESS_KEY_ID:-}
      R2_SECRET_ACCESS_KEY: ${R2_SECRET_ACCESS_KEY:-}
      R2_BUCKET: ${R2_BUCKET:-}
      R2_PUBLIC_BASE_URL: ${R2_PUBLIC_BASE_URL:-}
      R2_ENTRY_MEDIA_BUCKET: ${R2_ENTRY_MEDIA_BUCKET:-}
      R2_ENTRY_MEDIA_KEY_PREFIX: ${R2_ENTRY_MEDIA_KEY_PREFIX:-entries/media}
      R2_MAX_ENTRY_IMAGE_SIZE_BYTES: ${R2_MAX_ENTRY_IMAGE_SIZE_BYTES:-5242880}
      R2_MAX_ENTRY_AUDIO_SIZE_BYTES: ${R2_MAX_ENTRY_AUDIO_SIZE_BYTES:-10485760}
      R2_MAX_ENTRY_VIDEO_SIZE_BYTES: ${R2_MAX_ENTRY_VIDEO_SIZE_BYTES:-52428800}
      R2_MAX_ENTRY_DRAWING_SIZE_BYTES: ${R2_MAX_ENTRY_DRAWING_SIZE_BYTES:-5242880}
      R2_MAX_ENTRY_AUDIO_DURATION_SECONDS: ${R2_MAX_ENTRY_AUDIO_DURATION_SECONDS:-300}
      R2_MAX_ENTRY_VIDEO_DURATION_SECONDS: ${R2_MAX_ENTRY_VIDEO_DURATION_SECONDS:-60}
      FFPROBE_PATH: ${FFPROBE_PATH:-ffprobe}
      FFPROBE_TIMEOUT_SECONDS: ${FFPROBE_TIMEOUT_SECONDS:-10}
    ports:
      - "${BACKEND_PORT:-8080}:8080"

volumes:
  mysql_data:
